name: zizmor

on:
  pull_request:
    paths: &paths
      - '.github/**.yml'
      - '.github/**.yaml'
  push:
    branches:
      - master
    paths: *paths

permissions:
  actions: read # Required by zizmor when reading workflow metadata through the API
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: auditor
          advanced-security: false
          annotations: true
          # Pinned like the monorepo template: a floating zizmor would flap
          # on every upstream release, and the online pin-comment audit it
          # grew flags the whole fleet's `# v2` setup-php comments.
          online-audits: false
          version: 1.25.2
